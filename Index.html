<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemverse V2.8 - Alpha Build (Physics Worker)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        :root {
            --panel-bg: rgba(13, 22, 32, 0.85);
            --accent-color: #ffd166;
            --text-color: #eaf6ff;
            --energy-color: #4ade80;
        }
        body {
            margin: 0;
            overflow: hidden;
            background: #071226;
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
        }
        canvas { display: block; }
        #loadingOverlay {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 300;
            background: #071226;
            color: var(--accent-color);
            font-size: 24px;
            transition: opacity 0.5s ease-out;
        }
        #hud {
            position: fixed;
            top: 15px;
            left: 15px;
            background: var(--panel-bg);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 280px;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        #hud h3 { margin: 0 0 10px 0; color: var(--accent-color); }
        #hud div { margin-top: 5px; font-size: 14px; }
        #hud .key { opacity: 0.7; }
        #hud button {
             padding: 5px 10px;
             margin-top: 5px;
             cursor: pointer;
             background: rgba(255,255,255,0.1);
             border: 1px solid rgba(255,255,255,0.2);
             color: var(--text-color);
             border-radius: 5px;
        }
        #hud button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 2px;
            height: 20px;
            background: rgba(255, 255, 255, 0.7);
            transform: translate(-50%, -50%);
            z-index: 101;
            display: none;
        }
        #crosshair::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 2px;
            background: rgba(255, 255, 255, 0.7);
            top: 9px;
            left: -9px;
        }
    </style>
</head>
<body>
    <div id="loadingOverlay">Initializing Physics...</div>

    <div id="hud" style="display: none;">
        <h3>Gemverse V2.8</h3>
        <div><span class="key">Position:</span> <span id="coords">(0, 0, 0)</span></div>
        <div style="font-size: 12px; opacity: 0.7;">
            LMB/E: Place | RMB/Q: Break<br>
            WASD: Move | Mouse: Look<br>
            Space: Jump
        </div>
    </div>

    <div id="crosshair"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- GAME SETUP ---
        let scene, camera, renderer, player, spawnPoint;
        let world = new Map();
        let blockMeshes = new Map();
        let highlightMesh;
        const keys = {};

        const WORLD_SIZE = 50; const HALF_WORLD_SIZE = WORLD_SIZE / 2;
        const BLOCK_TYPES = { 1: { name: 'Grass', color: '#3fb34f' }, 2: { name: 'Stone', color: '#9aa0a6' }, };
        let textures = {};
        
        const physicsWorker = new Worker('physics.js');
        
        // --- CORE FUNCTIONS ---
        async function init() {
            textures[1] = createProceduralTexture(BLOCK_TYPES[1].color, '#7a4f29');
            textures[2] = createProceduralTexture(BLOCK_TYPES[2].color, '#6b7280');

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const sun = new THREE.DirectionalLight(0xffffff, 0.8);
            sun.position.set(50, 50, 50);
            scene.add(sun);
            
            spawnPoint = new THREE.Vector3(HALF_WORLD_SIZE, 1.5, HALF_WORLD_SIZE);
            player = { 
                position: new THREE.Vector3().copy(spawnPoint), 
                quaternion: new THREE.Quaternion(),
                yaw: 0, 
                pitch: 0, 
            };
            camera.position.copy(player.position);
            
            const highlightGeometry = new THREE.EdgesGeometry(new THREE.BoxGeometry(1.01, 1.01, 1.01));
            const highlightMaterial = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2, transparent: true, opacity: 0.8 });
            highlightMesh = new THREE.LineSegments(highlightGeometry, highlightMaterial);
            highlightMesh.visible = false;
            scene.add(highlightMesh);

            createWorldCube();
            setupEventListeners();
            
            // --- Initialize Physics Worker ---
            const worldDataForWorker = Array.from(world.entries()).map(([key, id]) => ({ key, id }));
            physicsWorker.postMessage({
                type: 'init',
                data: {
                    player: { 
                        position: player.position,
                        height: 1.8, width: 0.8,
                    },
                    world: worldDataForWorker
                }
            });
            
            physicsWorker.onmessage = (e) => {
                const { type, position, quaternion, onGround } = e.data;
                if (type === 'state_update') {
                    player.position.copy(position);
                    player.quaternion.copy(quaternion);
                }
            };
            
            document.getElementById('loadingOverlay').style.display = 'none';
            document.getElementById('hud').style.display = 'block';

            renderer.setAnimationLoop(animate);
        }

        function createWorldCube() {
            const geo = new THREE.BoxGeometry(WORLD_SIZE, WORLD_SIZE, WORLD_SIZE);
            const mat = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.1 });
            const cube = new THREE.Mesh(geo, mat);
            cube.position.set(HALF_WORLD_SIZE, HALF_WORLD_SIZE, HALF_WORLD_SIZE);
            scene.add(cube);
            for(let i = 0; i < WORLD_SIZE; i++) { for(let j = 0; j < WORLD_SIZE; j++) { addVoxel(i, 0, j, 2); addVoxel(i, WORLD_SIZE - 1, j, 2); addVoxel(0, i, j, 1); addVoxel(WORLD_SIZE - 1, i, j, 1); addVoxel(i, j, 0, 1); addVoxel(i, j, WORLD_SIZE - 1, 1); } }
        }

        function createProceduralTexture(c1, c2) { const c = document.createElement('canvas'); c.width=16; c.height=16; const ctx = c.getContext('2d'); ctx.fillStyle=c1; ctx.fillRect(0,0,16,16); for(let i=0;i<40;i++) { ctx.fillStyle=c2; ctx.globalAlpha=Math.random()*0.5+0.2; ctx.fillRect(Math.random()*16,Math.random()*16,2,2); } const t=new THREE.CanvasTexture(c); t.magFilter=THREE.NearestFilter; t.minFilter=THREE.NearestFilter; return t; }
        
        function addVoxel(x, y, z, blockId) { const key = `${x},${y},${z}`; const geo = new THREE.BoxGeometry(1, 1, 1); const mat = new THREE.MeshLambertMaterial({ map: textures[blockId] }); const mesh = new THREE.Mesh(geo, mat); mesh.position.set(x + 0.5, y + 0.5, z + 0.5); scene.add(mesh); world.set(key, blockId); blockMeshes.set(key, mesh); }
        
        function animate() {
            updateCameraAndInput();
            updateHighlight();
            updateHUD();
            renderer.render(scene, camera);
        }
        
        function updateCameraAndInput() {
            const rotSpeed = 0.02;
            if (keys['arrowleft']) player.yaw += rotSpeed;
            if (keys['arrowright']) player.yaw -= rotSpeed;
            if (keys['arrowup']) player.pitch += rotSpeed;
            if (keys['arrowdown']) player.pitch -= rotSpeed;
            player.pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, player.pitch));
            
            const lookQuaternion = new THREE.Quaternion().setFromEuler(new THREE.Euler(player.pitch, player.yaw, 0, 'YXZ'));
            
            camera.position.copy(player.position);
            camera.quaternion.copy(player.quaternion).multiply(lookQuaternion);
        }

        function showMessage(text) { const msg = document.createElement('div'); msg.className = 'message'; msg.textContent = text; document.body.appendChild(msg); setTimeout(() => msg.remove(), 3000); }
        function updateHighlight() { /* ... */ }

        function setupEventListeners() {
            document.addEventListener('keydown', (e) => {
                const key = e.key.toLowerCase();
                if(!keys[key]) {
                    keys[key] = true;
                    physicsWorker.postMessage({ type: 'input', data: { key, pressed: true }});
                }
            });
            document.addEventListener('keyup', (e) => {
                const key = e.key.toLowerCase();
                keys[key] = false;
                physicsWorker.postMessage({ type: 'input', data: { key, pressed: false }});
            });
            
            renderer.domElement.addEventListener('click', () => { renderer.domElement.requestPointerLock().catch(e => {}); });
            document.addEventListener('pointerlockchange', () => { document.getElementById('crosshair').style.display = document.pointerLockElement === renderer.domElement ? 'block' : 'none'; });
            
            document.addEventListener('mousemove', (e) => {
                if(document.pointerLockElement !== renderer.domElement) return;
                player.yaw -= e.movementX * 0.002;
                player.pitch -= e.movementY * 0.002;
            });
            window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
        }
        
        function updateHUD() {
            document.getElementById('coords').textContent = `(${player.position.x.toFixed(1)}, ${player.position.y.toFixed(1)}, ${player.position.z.toFixed(1)})`; 
        }
        
        // --- START ---
        init();
    </script>
</body>
</html>
